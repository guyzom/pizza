name: Game quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  # Keep standalone checks separate from checks called by the Pages workflow.
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: for file in game/*.js; do node --check "$file"; done
      - name: Unit tests
        run: node --test tests/*.test.cjs
      - name: Package project source
        run: tar -czf project-source.tar.gz game README.md QA.md THIRD_PARTY_NOTICES.md licenses docs tests .github .gitignore
      - uses: actions/upload-artifact@v4
        with:
          name: project-source
          path: project-source.tar.gz
          retention-days: 7
  browser:
    needs: rules
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.55.0
      - run: python -m playwright install --with-deps ${{ matrix.engine }}
      - name: Full campaign simulation (null renderer, not a visual test)
        if: matrix.engine == 'chromium'
        run: python tests/simulation.py
      - name: Family controls and recovery integration (null renderer)
        if: matrix.engine == 'chromium'
        run: python tests/family_flows.py
      - name: Game interaction and real-render checks
        run: xvfb-run -a python tests/browser.py --engine ${{ matrix.engine }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.engine }}
          path: test-results/
          retention-days: 14
